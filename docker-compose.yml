# docker compose up --build   ->  http://localhost:3000
services:
  web:
    build: .
    ports: ["3000:3000"]
    env_file: [{ path: .env.local, required: false }]
    environment:
      CNN_SERVICE_URL: http://cnn:8000
    depends_on: [cnn]
    restart: unless-stopped
  cnn:
    build: ./cnn-service     # trains the layout CNN on synthetic pages during the image build
    expose: ["8000"]
    restart: unless-stopped
